<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;700&display=swap" rel="stylesheet">
    <title>GrassProject</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        .maindiv {
            background-color: #333333;
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: space-between;
        }

        .firstsection {
            font-family: Ubuntu;
            background-color: #333333;
            flex-direction: column;
            margin: auto;
            justify-content: center;
            color: white;
            
            
        }

        .languagetext {
            text-align: center;
        }

        #englishbtn {
            width: 46.5vh;
            height: 7.5vh;
            margin-top: 2.5vh;
            font-family: Ubuntu;
            font-size: larger;
            font-weight: 500;
            background-color: #2b2b2b;
            color: skyblue;
            border: none;
            border-radius: 10px;
        }

        #englishbtn:hover {
            border: solid;
            color: deepskyblue;
            border-color: #444444;
        }

        #englishbtn:active {
            background-color: skyblue;
            color: #333333;
            border: solid;
            border-color: skyblue;
        }

        #turkishbtn {
            width: 46.5vh;
            height: 7.5vh;
            margin-top: 5vh;
            font-family: Ubuntu;
            font-size: larger;
            font-weight: 500;
            background-color: #2b2b2b;
            color: skyblue;
            border: none;
            border-radius: 10px;
        }

        #turkishbtn:hover {
            border: solid;
            color: deepskyblue;
            border-color: #444444;
        }

        #turkishbtn:active {
            background-color: skyblue;
            color: #333333;
            border: solid;
            border-color: skyblue;
        }

    </style>

</head>
<body>
    
    <div class="maindiv">

        <div></div>

        <section class="firstsection">
            <h1 class="languagetext">Select Language - Dil Seçin</h1>
            <br>
            <a href="home-en.html">
            <button id="englishbtn">English</button>
            </a>
            <br>
            <a href="home-tr.html">
            <button id="turkishbtn">Türkçe</button>
            </a>
        </section>

        

    </div>

</body>
</html>
